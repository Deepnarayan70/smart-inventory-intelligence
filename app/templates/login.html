{% extends 'base.html' %}

{% block title %}Login - Smart Inventory Intelligence{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-box-seam-fill text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-3 fw-bold">Welcome back</h3>
                    <p class="text-muted">Sign in to manage your inventory, sales, and demand forecasts.</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="name@company.com">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
                        Log In
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-medium text-decoration-none">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
