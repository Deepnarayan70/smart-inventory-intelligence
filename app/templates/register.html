{% extends 'base.html' %}

{% block title %}Register - Smart Inventory Intelligence{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-box-seam-fill text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-3 fw-bold">Create Account</h3>
                    <p class="text-muted">Start tracking and forecasting your inventory today.</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-medium">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required autofocus placeholder="Deep Narayan">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="name@company.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-medium">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
                        Register Account
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small">
                        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-medium text-decoration-none">Log in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
